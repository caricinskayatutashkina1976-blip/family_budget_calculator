<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Кодировка и масштаб для корректного отображения на телефонах -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор семейного бюджета</title>
  <!-- Сразу ставим data-theme из localStorage, чтобы не мигала светлая тема при загрузке -->
  <script>
    (function () {
      try {
        if (localStorage.getItem("family-budget-theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) { /* localStorage может быть недоступен — остаёмся в светлой теме */ }
    })();
  </script>
  <style>
    /*
      === ПЕРЕМЕННЫЕ ТЕМЫ ===
      Цвета вынесены в :root (светлая тема по умолчанию).
      Для тёмной темы те же имена переопределяются в html[data-theme="dark"].
    */
    :root {
      color-scheme: light;
      --transition-theme: background 0.45s ease, color 0.35s ease, border-color 0.35s ease,
        box-shadow 0.4s ease, fill 0.35s ease;

      --body-bg: linear-gradient(160deg, #e8f4fc 0%, #f5f0fa 50%, #fdf8f3 100%);
      --text: #1a2332;
      --h1: #0f3460;
      --subtitle: #5a6b7d;

      --card-bg: #fff;
      --card-border: rgba(15, 52, 96, 0.06);
      --card-shadow: 0 4px 24px rgba(15, 52, 96, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04);

      --section-title: #3d5a80;
      --section-border: #e3eef8;
      --label: #334155;

      --input-bg: #f8fafc;
      --input-border: #cbd5e1;
      --input-focus-bg: #fff;
      --input-focus-ring: rgba(59, 130, 246, 0.2);

      --results-border: #e2e8f0;

      --hero-bg: linear-gradient(180deg, #f0f9ff 0%, #fff 100%);
      --hero-border: #bae6fd;
      --hero-label: #0369a1;
      --hero-amount: #0c4a6e;

      --stat-bg: #f8fafc;
      --stat-border: #e2e8f0;
      --stat-label: #64748b;
      --stat-value: #0f172a;

      --footer: #94a3b8;

      --btn-secondary-bg: #f1f5f9;
      --btn-secondary-color: #475569;
      --btn-secondary-border: #e2e8f0;
      --btn-secondary-hover: #e2e8f0;

      --btn-theme-bg: #fff;
      --btn-theme-color: #334155;
      --btn-theme-border: #e2e8f0;
      --btn-theme-shadow: 0 2px 12px rgba(15, 52, 96, 0.1);
      --btn-theme-hover: #f8fafc;

      --positive: #047857;
      --negative: #b91c1c;

      --excellent-bg: #d1fae5;
      --excellent-text: #065f46;
      --excellent-border: #6ee7b7;
      --balance-bg: #fef3c7;
      --balance-text: #92400e;
      --balance-border: #fcd34d;
      --deficit-bg: #fee2e2;
      --deficit-text: #991b1b;
      --deficit-border: #fca5a5;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --body-bg: linear-gradient(160deg, #0c1929 0%, #151e2e 50%, #1a1520 100%);
      --text: #e2e8f0;
      --h1: #93c5fd;
      --subtitle: #94a3b8;

      --card-bg: #1e293b;
      --card-border: rgba(148, 163, 184, 0.15);
      --card-shadow: 0 4px 28px rgba(0, 0, 0, 0.45), 0 1px 0 rgba(255, 255, 255, 0.04);

      --section-title: #7dd3fc;
      --section-border: rgba(56, 189, 248, 0.2);
      --label: #cbd5e1;

      --input-bg: #0f172a;
      --input-border: #475569;
      --input-focus-bg: #1e293b;
      --input-focus-ring: rgba(96, 165, 250, 0.35);

      --results-border: #334155;

      --hero-bg: linear-gradient(180deg, #0c4a6e 0%, #1e293b 100%);
      --hero-border: #0369a1;
      --hero-label: #7dd3fc;
      --hero-amount: #e0f2fe;

      --stat-bg: #0f172a;
      --stat-border: #334155;
      --stat-label: #94a3b8;
      --stat-value: #f1f5f9;

      --footer: #64748b;

      --btn-secondary-bg: #334155;
      --btn-secondary-color: #e2e8f0;
      --btn-secondary-border: #475569;
      --btn-secondary-hover: #475569;

      --btn-theme-bg: #1e293b;
      --btn-theme-color: #e2e8f0;
      --btn-theme-border: #475569;
      --btn-theme-shadow: 0 2px 16px rgba(0, 0, 0, 0.4);
      --btn-theme-hover: #334155;

      --positive: #34d399;
      --negative: #f87171;

      --excellent-bg: rgba(16, 185, 129, 0.2);
      --excellent-text: #6ee7b7;
      --excellent-border: rgba(52, 211, 153, 0.45);
      --balance-bg: rgba(251, 191, 36, 0.15);
      --balance-text: #fcd34d;
      --balance-border: rgba(251, 191, 36, 0.4);
      --deficit-bg: rgba(248, 113, 113, 0.15);
      --deficit-text: #fca5a5;
      --deficit-border: rgba(248, 113, 113, 0.45);
    }

    /*
      === БАЗОВЫЕ СТИЛИ ===
      * { box-sizing: border-box } — padding и border входят в ширину блока,
      так проще верстать адаптивную сетку.
    */
    * {
      box-sizing: border-box;
    }

    html {
      transition: var(--transition-theme);
    }

    /* Фон страницы и текст берутся из переменных — плавная смена темы */
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--body-bg);
      color: var(--text);
      line-height: 1.5;
      padding: 3.75rem 1.25rem 1.25rem;
      transition: var(--transition-theme);
    }

    /*
      Кнопка переключения темы: фиксированно в правом верхнем углу окна браузера.
      position: fixed — не прокручивается вместе с контентом.
    */
    .btn-theme {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 100;
      padding: 0.55rem 0.9rem;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      border: 1px solid var(--btn-theme-border);
      border-radius: 10px;
      cursor: pointer;
      background: var(--btn-theme-bg);
      color: var(--btn-theme-color);
      box-shadow: var(--btn-theme-shadow);
      transition: var(--transition-theme), transform 0.1s;
    }

    .btn-theme:hover {
      background: var(--btn-theme-hover);
    }

    .btn-theme:active {
      transform: scale(0.98);
    }

    /* Ограничиваем ширину контента — на больших экранах карточка не растягивается слишком широко */
    .wrap {
      max-width: 520px;
      margin: 0 auto;
    }

    /* Заголовок страницы */
    h1 {
      font-size: clamp(1.35rem, 4vw, 1.75rem);
      font-weight: 700;
      text-align: center;
      margin: 0 0 0.35rem;
      color: var(--h1);
      transition: var(--transition-theme);
    }

    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: var(--subtitle);
      margin: 0 0 1.5rem;
      transition: var(--transition-theme);
    }

    /* Карточка — основной блок с полями и результатами */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      padding: 1.5rem;
      border: 1px solid var(--card-border);
      transition: var(--transition-theme);
    }

    @media (min-width: 480px) {
      .card {
        padding: 1.75rem 2rem;
      }
    }

    /* Секции «Доходы» и «Расходы» */
    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--section-title);
      margin: 1.25rem 0 0.75rem;
      padding-bottom: 0.35rem;
      border-bottom: 2px solid var(--section-border);
      transition: var(--transition-theme);
    }

    .section-title:first-of-type {
      margin-top: 0;
    }

    /* Одна строка: подпись + поле ввода */
    .field {
      margin-bottom: 0.85rem;
    }

    .field label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--label);
      margin-bottom: 0.35rem;
      transition: var(--transition-theme);
    }

    /* Поля ввода чисел */
    .field input {
      width: 100%;
      padding: 0.65rem 0.85rem;
      font-size: 1rem;
      border: 1px solid var(--input-border);
      border-radius: 10px;
      background: var(--input-bg);
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s, background 0.35s ease, color 0.35s ease;
    }

    .field input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px var(--input-focus-ring);
      background: var(--input-focus-bg);
    }

    /* Ряд с кнопками */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-top: 1.35rem;
    }

    .actions button {
      flex: 1;
      min-width: 140px;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s;
    }

    .actions button:active {
      transform: scale(0.98);
    }

    /* Основная кнопка расчёта (градиент не зависит от темы — узнаваемая кнопка) */
    .btn-primary {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    /* Вторичная кнопка «Очистить» */
    .btn-secondary {
      background: var(--btn-secondary-bg);
      color: var(--btn-secondary-color);
      border: 1px solid var(--btn-secondary-border);
      transition: var(--transition-theme), transform 0.1s;
    }

    .btn-secondary:hover {
      background: var(--btn-secondary-hover);
    }

    /* Блок результатов скрыт до первого расчёта */
    .results {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--results-border);
      display: none;
      transition: border-color 0.35s ease;
    }

    .results.visible {
      display: block;
    }

    /* Крупная итоговая сумма (остаток) */
    .hero-balance {
      text-align: center;
      padding: 1rem 0.5rem 1.25rem;
      background: var(--hero-bg);
      border-radius: 12px;
      margin-bottom: 1rem;
      border: 1px solid var(--hero-border);
      transition: var(--transition-theme);
    }

    .hero-balance .label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--hero-label);
      margin-bottom: 0.25rem;
      transition: var(--transition-theme);
    }

    .hero-balance .amount {
      font-size: clamp(1.75rem, 7vw, 2.35rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--hero-amount);
      line-height: 1.2;
      transition: color 0.35s ease;
    }

    /* Положительный / отрицательный остаток — цвета из переменных для читаемости в обеих темах */
    .hero-balance .amount.positive {
      color: var(--positive);
    }

    .hero-balance .amount.negative {
      color: var(--negative);
    }

    /* Сетка мелких показателей */
    .stats {
      display: grid;
      gap: 0.65rem;
    }

    @media (min-width: 400px) {
      .stats {
        grid-template-columns: 1fr 1fr;
      }
    }

    .stat {
      background: var(--stat-bg);
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--stat-border);
      transition: var(--transition-theme);
    }

    .stat .stat-label {
      font-size: 0.75rem;
      color: var(--stat-label);
      margin-bottom: 0.2rem;
      transition: var(--transition-theme);
    }

    .stat .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--stat-value);
      transition: var(--transition-theme);
    }

    /* Финансовый статус — отдельная заметная плашка */
    .status {
      margin-top: 1rem;
      padding: 1rem 1.1rem;
      border-radius: 10px;
      font-weight: 600;
      text-align: center;
      font-size: 1rem;
      transition: background 0.35s ease, color 0.35s ease, border-color 0.35s ease;
    }

    .status.excellent {
      background: var(--excellent-bg);
      color: var(--excellent-text);
      border: 1px solid var(--excellent-border);
    }

    .status.balance {
      background: var(--balance-bg);
      color: var(--balance-text);
      border: 1px solid var(--balance-border);
    }

    .status.deficit {
      background: var(--deficit-bg);
      color: var(--deficit-text);
      border: 1px solid var(--deficit-border);
    }

    footer {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: var(--footer);
      transition: var(--transition-theme);
    }
  </style>
</head>
<body>
  <!-- В светлой теме подпись «Тёмная», в тёмной — «Светлая»; текст обновляет JavaScript -->
  <button type="button" class="btn-theme" id="btn-theme" aria-label="Переключить тему оформления">🌙 Тёмная</button>

  <div class="wrap">
    <h1>Калькулятор семейного бюджета</h1>
    <p class="subtitle">Расчёт за один месяц. Все данные остаются в браузере.</p>

    <div class="card">
      <!-- Форма: method отсутствует — отправка по умолчанию не уходит на сервер, обработка через JS -->
      <form id="budget-form" novalidate>
        <p class="section-title">Доходы</p>

        <div class="field">
          <label for="salary1">Зарплата 1 (₽)</label>
          <input type="number" id="salary1" name="salary1" min="0" step="0.01" placeholder="0" inputmode="decimal">
        </div>
        <div class="field">
          <label for="salary2">Зарплата 2 (₽)</label>
          <input type="number" id="salary2" name="salary2" min="0" step="0.01" placeholder="0" inputmode="decimal">
        </div>
        <div class="field">
          <label for="extra">Дополнительный доход (₽)</label>
          <input type="number" id="extra" name="extra" min="0" step="0.01" placeholder="0" inputmode="decimal">
        </div>

        <p class="section-title">Расходы</p>

        <div class="field">
          <label for="food">Продукты (₽)</label>
          <input type="number" id="food" name="food" min="0" step="0.01" placeholder="0" inputmode="decimal">
        </div>
        <div class="field">
          <label for="utilities">Коммунальные платежи (₽)</label>
          <input type="number" id="utilities" name="utilities" min="0" step="0.01" placeholder="0" inputmode="decimal">
        </div>
        <div class="field">
          <label for="transport">Транспорт (₽)</label>
          <input type="number" id="transport" name="transport" min="0" step="0.01" placeholder="0" inputmode="decimal">
        </div>
        <div class="field">
          <label for="comm">Связь и интернет (₽)</label>
          <input type="number" id="comm" name="comm" min="0" step="0.01" placeholder="0" inputmode="decimal">
        </div>
        <div class="field">
          <label for="credits">Кредиты (₽)</label>
          <input type="number" id="credits" name="credits" min="0" step="0.01" placeholder="0" inputmode="decimal">
        </div>
        <div class="field">
          <label for="kids">Дети и школа (₽)</label>
          <input type="number" id="kids" name="kids" min="0" step="0.01" placeholder="0" inputmode="decimal">
        </div>
        <div class="field">
          <label for="health">Здоровье (₽)</label>
          <input type="number" id="health" name="health" min="0" step="0.01" placeholder="0" inputmode="decimal">
        </div>
        <div class="field">
          <label for="fun">Развлечения (₽)</label>
          <input type="number" id="fun" name="fun" min="0" step="0.01" placeholder="0" inputmode="decimal">
        </div>
        <div class="field">
          <label for="other">Прочие расходы (₽)</label>
          <input type="number" id="other" name="other" min="0" step="0.01" placeholder="0" inputmode="decimal">
        </div>

        <div class="actions">
          <!-- type="submit" — при нажатии срабатывает событие submit у формы -->
          <button type="submit" class="btn-primary">Рассчитать бюджет</button>
          <!-- type="button" — не отправляет форму, только наш обработчик -->
          <button type="button" class="btn-secondary" id="btn-clear">Очистить</button>
        </div>
      </form>

      <!-- Результаты показываются после расчёта (класс .visible добавляется из JS) -->
      <div class="results" id="results" aria-live="polite">
        <div class="hero-balance">
          <div class="label">Остаток за месяц</div>
          <div class="amount" id="out-remainder">—</div>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="stat-label">Общий доход</div>
            <div class="stat-value" id="out-income">—</div>
          </div>
          <div class="stat">
            <div class="stat-label">Общие расходы</div>
            <div class="stat-value" id="out-expenses">—</div>
          </div>
          <div class="stat">
            <div class="stat-label">Расходы от дохода</div>
            <div class="stat-value" id="out-percent">—</div>
          </div>
        </div>

        <div class="status" id="out-status" role="status"></div>
      </div>
    </div>

    <footer>Работает полностью офлайн · без библиотек</footer>
  </div>

  <script>
    /*
      === ЛОГИКА КАЛЬКУЛЯТОРА ===
      Мы находим элементы страницы (DOM), вешаем обработчики событий
      и при нажатии «Рассчитать» суммируем поля и выводим результат.
    */

    // Ключ в localStorage для сохранения темы (отдельно от логики расчётов)
    var THEME_KEY = "family-budget-theme";

    // Ссылки на форму и блок результатов — удобно обращаться по id
    var form = document.getElementById("budget-form");
    var resultsEl = document.getElementById("results");
    var btnClear = document.getElementById("btn-clear");
    var btnTheme = document.getElementById("btn-theme");

    // Поля вывода
    var outRemainder = document.getElementById("out-remainder");
    var outIncome = document.getElementById("out-income");
    var outExpenses = document.getElementById("out-expenses");
    var outPercent = document.getElementById("out-percent");
    var outStatus = document.getElementById("out-status");

    /**
     * Возвращает текущую тему: "light" или "dark".
     * Тёмная тема задаётся атрибутом data-theme="dark" на элементе <html>.
     */
    function getTheme() {
      return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
    }

    /**
     * Устанавливает тему, записывает выбор в localStorage и обновляет подпись кнопки.
     * Расчёты бюджета эта функция не трогает.
     */
    function setTheme(theme) {
      if (theme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      } else {
        document.documentElement.removeAttribute("data-theme");
      }
      try {
        localStorage.setItem(THEME_KEY, theme);
      } catch (e) {
        /* игнорируем, если хранилище недоступно */
      }
      updateThemeButtonLabel();
    }

    /**
     * Текст кнопки: в светлой теме предлагаем перейти в тёмную и наоборот.
     */
    function updateThemeButtonLabel() {
      if (!btnTheme) return;
      if (getTheme() === "dark") {
        btnTheme.textContent = "☀️ Светлая";
        btnTheme.setAttribute("aria-label", "Включить светлую тему");
      } else {
        btnTheme.textContent = "🌙 Тёмная";
        btnTheme.setAttribute("aria-label", "Включить тёмную тему");
      }
    }

    function toggleTheme() {
      setTheme(getTheme() === "dark" ? "light" : "dark");
    }

    // Синхронизируем подпись кнопки с темой, уже применённой скриптом в <head>
    updateThemeButtonLabel();

    if (btnTheme) {
      btnTheme.addEventListener("click", toggleTheme);
    }

    /**
     * Читает значение поля ввода как число.
     * Пустая строка или невалидное значение считаются нулём — так проще для пользователя.
     * parseFloat понимает десятичные числа с точкой.
     */
    function readNumber(id) {
      var el = document.getElementById(id);
      var v = parseFloat(el.value);
      return isNaN(v) || v < 0 ? 0 : v;
    }

    /**
     * Форматирует число для отображения: пробелы между разрядами, 2 знака после запятой при необходимости.
     * toLocaleString использует локаль 'ru-RU' — привычный вид сумм.
     */
    function formatMoney(n) {
      return n.toLocaleString("ru-RU", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }) + " ₽";
    }

    /**
     * Определяет текст и CSS-класс статуса по правилам задания.
     * twentyPercent — 20% от дохода; сравниваем с остатком (доход минус расходы).
     */
    function getFinancialStatus(totalIncome, remainder) {
      // Если дохода нет, процент «запаса» от дохода математически не определён — упрощаем логику
      if (totalIncome <= 0) {
        if (remainder < 0) {
          return { text: "Расходы превышают доходы", cls: "deficit" };
        }
        return { text: "Бюджет в балансе", cls: "balance" };
      }

      var threshold = totalIncome * 0.2;

      if (remainder > threshold) {
        return { text: "Отлично, есть запас", cls: "excellent" };
      }
      if (remainder >= 0) {
        // от 0 до 20% дохода включительно
        return { text: "Бюджет в балансе", cls: "balance" };
      }
      return { text: "Расходы превышают доходы", cls: "deficit" };
    }

    /**
     * Основная функция расчёта: вызывается при отправке формы.
     */
    function calculateBudget(ev) {
      // ev.preventDefault() — чтобы страница не перезагружалась (стандартное поведение формы)
      if (ev) ev.preventDefault();

      // --- Суммируем доходы ---
      var salary1 = readNumber("salary1");
      var salary2 = readNumber("salary2");
      var extra = readNumber("extra");
      var totalIncome = salary1 + salary2 + extra;

      // --- Суммируем все статьи расходов ---
      var totalExpenses =
        readNumber("food") +
        readNumber("utilities") +
        readNumber("transport") +
        readNumber("comm") +
        readNumber("credits") +
        readNumber("kids") +
        readNumber("health") +
        readNumber("fun") +
        readNumber("other");

      // Остаток = доходы минус расходы
      var remainder = totalIncome - totalExpenses;

      // Процент расходов от дохода (если доход 0 — делить нельзя, показываем прочерк)
      var expensePercentText;
      if (totalIncome > 0) {
        var pct = (totalExpenses / totalIncome) * 100;
        expensePercentText = pct.toLocaleString("ru-RU", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 1
        }) + " %";
      } else {
        expensePercentText = "—";
      }

      // Заполняем блок результатов
      outIncome.textContent = formatMoney(totalIncome);
      outExpenses.textContent = formatMoney(totalExpenses);
      outPercent.textContent = expensePercentText;
      outRemainder.textContent = formatMoney(remainder);

      // Крупная сумма: зелёный если плюс, красный если минус
      outRemainder.classList.remove("positive", "negative");
      if (remainder > 0) {
        outRemainder.classList.add("positive");
      } else if (remainder < 0) {
        outRemainder.classList.add("negative");
      }

      var status = getFinancialStatus(totalIncome, remainder);
      outStatus.textContent = status.text;
      // Сбрасываем старые классы статуса и ставим новый
      outStatus.className = "status " + status.cls;

      // Показываем блок результатов
      resultsEl.classList.add("visible");
    }

    /**
     * Очищает все поля и скрывает результаты.
     */
    function clearForm() {
      form.reset();
      resultsEl.classList.remove("visible");
      outRemainder.classList.remove("positive", "negative");
      outStatus.textContent = "";
      outStatus.className = "status";
    }

    // Слушатель отправки формы (кнопка «Рассчитать бюджет» с type="submit")
    form.addEventListener("submit", calculateBudget);

    // Кнопка «Очистить»
    btnClear.addEventListener("click", clearForm);
  </script>
</body>
</html>
